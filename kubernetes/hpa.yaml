apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: maha-agri-backend-hpa
  namespace: maha-agri-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: maha-agri-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
