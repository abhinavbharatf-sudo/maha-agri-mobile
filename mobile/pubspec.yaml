  local_auth: ^2.1.8
  qr_code_scanner: ^1.0.1
  geolocator: ^10.1.0
  camera: ^0.10.5+9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
