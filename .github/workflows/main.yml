name: Auto Sync and Deploy to abhinavbharatfoundation-v5

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bolt Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to abhinavbharatfoundation-v5 Repository
        run: |
          git remote add abhinavbharatfoundation-v5 https://${{ secrets.SYNC_TOKEN }}@github.com/abhinavbharatf-sudo/abhinavbharatfoundation-v5.git
          git push abhinavbharatfoundation-v5 main:main --force

      - name: Trigger Live Deploy Workflow
        run: |
          curl -X POST -H "Authorization: token ${{ secrets.SYNC_TOKEN }}" -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/abhinavbharatf-sudo/abhinavbharatfoundation-v5/actions/workflows/deploy.yml/dispatches -d '{"ref":"main"}'
